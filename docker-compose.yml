version: '3.8'
services:
  frontend:
    build: ./global-frontend
    container_name: platform-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

  backend:
    build: ./retailer-mfg-backend
    container_name: platform-backend
    ports:
      - "5000:5000"
    environment:
      - REDIS_HOST=redis
      - INGEST_API_KEY=855bfc98d7544d8eb030b9c702580db9ff32889c83ce9707864f7dbe8fa41288
    depends_on:
      - redis
      - rabbitmq

  redis:
    image: redis:alpine
    container_name: platform-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: platform-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
  
  nlp-engine:
    build: ./nlp-engine
    container_name: platform-nlp
    ports:
      - "8000:8000"
    depends_on:
      - backend

  trend-pipeline:
    build: ./trend-pipeline
    container_name: platform-trend-pipeline
    ports:
      - "8001:8001"
    environment:
      - NODE_DUMP_URL=http://platform-backend:5000/api/trends/dump
      - INGEST_API_KEY=${INGEST_API_KEY}
      - ADMIN_KEY=${TREND_PIPELINE_ADMIN_KEY}
      - POLL_INTERVAL_SECONDS=1800
      - GOOGLE_TRENDS_GEO=US
      - IG_HASHTAGS=fashion,streetwear,sustainablefashion
      - SEEN_STORE_PATH=/app/data/seen_trends.json
      - GOOGLE_TRENDS_FASHION_KEYWORDS=${GOOGLE_TRENDS_FASHION_KEYWORDS}
      - IG_ACCESS_TOKEN=${IG_ACCESS_TOKEN}
      - IG_BUSINESS_ACCOUNT_ID=${IG_BUSINESS_ACCOUNT_ID}
      - FB_PAGE_ACCESS_TOKEN=${FB_PAGE_ACCESS_TOKEN}
      - FB_PAGE_IDS=${FB_PAGE_IDS}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - YOUTUBE_MIN_INTERVAL_SECONDS=${YOUTUBE_MIN_INTERVAL_SECONDS}
    volumes:
      - trend_pipeline_data:/app/data
    depends_on:
      - backend

volumes:
  trend_pipeline_data: